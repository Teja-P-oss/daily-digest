<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Digest - Teja Potti</title>
    <meta name="description" content="Personal daily digest of news, research papers, and stocks.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
    <!-- Parallax 3D Background Layer -->
    <div class="background-effects">
        <div class="stars"></div>
        <div class="glow-orb orb-1"></div>
        <div class="glow-orb orb-2"></div>
        <div class="glow-orb orb-3"></div>
    </div>

    <header class="animate-header">
        <div class="container header-container">
            <div>
                <h1 id="page-title">Daily Digest</h1>
                <p id="date-subtitle">Loading index...</p>
            </div>
            <div class="date-picker-wrapper">
                <select id="date-selector" class="glass-select" aria-label="Select Date">
                    <option>Loading...</option>
                </select>
            </div>
        </div>
    </header>

    <main class="container" id="main-content">
        <!-- News Section -->
        <section class="card glass-card" id="news-section">
            <div class="card-header">
                <span class="icon">📰</span>
                <h2>Morning Brief</h2>
            </div>
            <div class="card-body">
                <div class="news-item">
                    <h3>🇮🇳 India</h3>
                    <p id="india-news-content"><span class="skeleton"></span></p>
                </div>
                <div class="news-item">
                    <h3>🌎 World</h3>
                    <p id="world-news-content"><span class="skeleton"></span></p>
                </div>
            </div>
        </section>

        <!-- Papers Section -->
        <section class="card glass-card" id="papers-section">
            <div class="card-header">
                <span class="icon">📄</span>
                <h2>Research Papers</h2>
            </div>
            <div class="card-body" id="papers-container">
                <!-- Skeletons will be replaced by app.js -->
                <div class="paper-item"><h3 class="skeleton"></h3><p class="skeleton"></p><p class="skeleton"></p></div>
                <hr class="divider">
                <div class="paper-item"><h3 class="skeleton"></h3><p class="skeleton"></p><p class="skeleton"></p></div>
                <hr class="divider">
                <div class="paper-item"><h3 class="skeleton"></h3><p class="skeleton"></p><p class="skeleton"></p></div>
            </div>
        </section>

        <!-- Stocks Section -->
        <section class="card glass-card" id="stocks-section">
            <div class="card-header">
                <span class="icon">📈</span>
                <h2>Market Movers</h2>
            </div>
            <div class="card-body">
                <div class="stocks-grid">
                    <div class="stock-market">
                        <h3>🇺🇸 US Stocks (Top 5)</h3>
                        <ul id="us-stocks-list" class="stock-list">
                            <li><span class="skeleton"></span></li>
                        </ul>
                    </div>
                    <div class="stock-market">
                        <h3>🇮🇳 Indian Stocks (Top 5)</h3>
                        <ul id="in-stocks-list" class="stock-list">
                            <li><span class="skeleton"></span></li>
                        </ul>
                    </div>
                </div>
            </div>
        </section>

        <!-- Takeaways Section -->
        <section class="card glass-card" id="takeaways-section">
            <div class="card-header">
                <span class="icon">💡</span>
                <h2>Today's Takeaways</h2>
            </div>
            <div class="card-body" id="takeaways-container">
                <div class="takeaways-content">
                    <h3>5 Things to Remember</h3>
                    <ul id="takeaways-remember-list">
                        <li><span class="skeleton"></span></li>
                        <li><span class="skeleton"></span></li>
                        <li><span class="skeleton"></span></li>
                        <li><span class="skeleton"></span></li>
                        <li><span class="skeleton"></span></li>
                    </ul>
                    <div class="explore-further mt-4">
                        <h3>One Thing to Explore Further</h3>
                        <div class="takeaway" id="takeaways-explore">
                            <span class="skeleton-small"></span>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <div class="container">
            <p>Automated by Antigravity AI for Teja Potti</p>
        </div>
    </footer>

    <script src="./js/app.js"></script>
</body>
</html>
