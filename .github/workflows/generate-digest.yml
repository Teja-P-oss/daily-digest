name: Generate Daily Digest

on:
  workflow_dispatch:
    inputs:
      date:
        description: "Optional historical date (YYYY-MM-DD); blank means today in India"
        required: false
        type: string
      regenerate:
        description: "Replace the edition if this date already exists"
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "30 13 * * *" # 7:00 PM Asia/Kolkata

permissions:
  contents: write

concurrency:
  group: daily-digest-publish
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_MODEL: gpt-5.6-terra
      RUN_DATE: ${{ inputs.date }}
      REGENERATE: ${{ inputs.regenerate }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Validate secret
        run: |
          if [[ -z "$OPENAI_API_KEY" ]]; then
            echo "OPENAI_API_KEY repository secret is missing." >&2
            exit 1
          fi

      - name: Generate and validate digest
        shell: bash
        run: |
          args=()
          if [[ -n "$RUN_DATE" ]]; then
            args+=(--date "$RUN_DATE")
          fi
          if [[ "$REGENERATE" == "true" ]]; then
            args+=(--force)
          fi
          python update_website.py "${args[@]}"

      - name: Commit and push published data
        shell: bash
        run: |
          git config user.name "daily-digest-bot"
          git config user.email "daily-digest-bot@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No content changes to publish."
            exit 0
          fi
          git commit -m "Update Teja's daily digest"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
